name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy
      - run: uv run pytest -m "not integration"

  integration:
    name: Lakehouse smoke test (docker compose)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Install dependencies in the workspace container
        run: docker compose exec -T workspace uv sync --frozen
      - name: Iceberg write/read on object storage
        run: docker compose exec -T workspace uv run pytest -m integration -v -p no:cacheprovider
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
