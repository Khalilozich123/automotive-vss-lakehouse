# Local COVESA telemetry lakehouse.
#
#   rustfs          S3-compatible object storage (stand-in for AWS S3)   :9000 API, :9001 console
#   storage-init    one-shot: creates the warehouse / landing / checkpoints buckets
#   postgres        backing store for the Iceberg catalog                :5432
#   iceberg-rest    Iceberg REST catalog                                 :8181
#   spark-master    Spark standalone master                              :8080 UI
#   spark-worker    Spark standalone worker                              :8081 UI
#   mosquitto       MQTT broker (TCU -> cloud telemetry)                 :1883
#   mqtt-bridge     MQTT -> s3://landing (Bronze landing zone)
#   airflow         orchestration: Bronze -> Silver -> Gold + quality gates  :8088 UI
#   workspace       dev container / Spark driver                         :4040 Spark job UI
#   fleet-simulator live telemetry from the simulated fleet  (opt-in: --profile simulate)
#
# Credentials and the VIN pseudonymization key below are local-only defaults; override them via
# environment variables (in production they come from a secret manager).
# All ports are bound to 127.0.0.1 so nothing is exposed to the network.

name: covesa-lakehouse

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lakehouse}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
  AWS_REGION: us-east-1

x-app-image: &app-image
  image: covesa-lakehouse/app:local
  build:
    context: ..
    dockerfile: docker/Dockerfile.app

x-spark-image: &spark-image
  image: covesa-lakehouse/spark:3.5.9-iceberg1.10.1
  build:
    context: .
    dockerfile: Dockerfile.spark
    target: runtime

services:
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage-init:
    image: amazon/aws-cli:latest
    environment: *s3-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for b in warehouse landing checkpoints; do
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket $$b 2>/dev/null
        || aws --endpoint-url http://rustfs:9000 s3 mb s3://$$b || exit 1;
        done
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iceberg_catalog
      POSTGRES_USER: ${CATALOG_DB_USER:-iceberg}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-iceberg}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d iceberg_catalog"]
      interval: 5s
      timeout: 3s
      retries: 20

  iceberg-rest:
    image: covesa-lakehouse/iceberg-rest:1.10.1
    build:
      context: rest-catalog
    environment:
      <<: *s3-env
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: ${CATALOG_DB_USER:-iceberg}
      CATALOG_JDBC_PASSWORD: ${CATALOG_DB_PASSWORD:-iceberg}
      CATALOG_JDBC_SCHEMA__VERSION: V1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://rustfs:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "127.0.0.1:8181:8181"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8181/v1/config"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  spark-master:
    <<: *spark-image
    command: ["spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080"]
      interval: 5s
      timeout: 3s
      retries: 20

  spark-worker:
    <<: *spark-image
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker",
              "--webui-port", "8081", "spark://spark-master:7077"]
    environment:
      <<: *s3-env
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-4}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-4g}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      spark-master:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1883"]
      interval: 5s
      timeout: 3s
      retries: 20

  workspace:
    image: covesa-lakehouse/dev:local
    build:
      context: .
      dockerfile: Dockerfile.spark
      target: dev
    hostname: workspace
    environment:
      <<: *s3-env
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_DRIVER_HOST: workspace
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-3g}   # the worker offers 4g
      SPARK_SHUFFLE_PARTITIONS: "32"                       # AQE coalesces small ones
      LAKEHOUSE_CATALOG_URI: http://iceberg-rest:8181
      LAKEHOUSE_WAREHOUSE: s3://warehouse/
      LAKEHOUSE_S3_ENDPOINT: http://rustfs:9000
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      VIN_PSEUDONYMIZATION_KEY: ${VIN_PSEUDONYMIZATION_KEY:-local-dev-only-key-not-for-production}
      VIN_PSEUDONYMIZATION_KEY_ID: ${VIN_PSEUDONYMIZATION_KEY_ID:-dev-1}
    volumes:
      - ..:/workspace:cached
      - ../.devcontainer:/workspace/.devcontainer:ro
      - dev-venv:/home/vscode/.venv
      - uv-cache:/home/vscode/.cache/uv
      - dev-history:/commandhistory
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      iceberg-rest:
        condition: service_healthy
      spark-worker:
        condition: service_started
      mosquitto:
        condition: service_healthy

  mqtt-bridge:
    <<: *app-image
    command: ["python", "-m", "covesa_lakehouse.bronze.mqtt_bridge"]
    environment:
      <<: *s3-env
      LAKEHOUSE_S3_ENDPOINT: http://rustfs:9000
      MQTT_HOST: mosquitto
      BRIDGE_CLIENT_ID: bronze-bridge-1   # fixed id = persistent MQTT session across restarts
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  airflow:
    image: covesa-lakehouse/airflow:3.3.2
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
      additional_contexts:
        spark-runtime: "service:spark-master"   # same runtime as the executors
    hostname: airflow   # tasks are Spark drivers; executors call back to this host
    environment:
      <<: *s3-env
      AIRFLOW_DB_USER: ${CATALOG_DB_USER:-iceberg}
      AIRFLOW_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-iceberg}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${CATALOG_DB_USER:-iceberg}:${CATALOG_DB_PASSWORD:-iceberg}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Paused until switched on in the UI: an automatic run must never race a manual/CI run
      # for the same streaming checkpoints.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/lakehouse/dags
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # local only (127.0.0.1)
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_DRIVER_HOST: airflow
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-3g}
      SPARK_SHUFFLE_PARTITIONS: "32"
      LAKEHOUSE_CATALOG_URI: http://iceberg-rest:8181
      LAKEHOUSE_WAREHOUSE: s3://warehouse/
      LAKEHOUSE_S3_ENDPOINT: http://rustfs:9000
      CONTRACTS_DIR: /opt/lakehouse/contracts
      PYTHONPATH: /opt/lakehouse/src   # mounted source wins over the copy baked into the image
      VIN_PSEUDONYMIZATION_KEY: ${VIN_PSEUDONYMIZATION_KEY:-local-dev-only-key-not-for-production}
      VIN_PSEUDONYMIZATION_KEY_ID: ${VIN_PSEUDONYMIZATION_KEY_ID:-dev-1}
    volumes:
      - ../dags:/opt/lakehouse/dags:ro
      - ../contracts:/opt/lakehouse/contracts:ro   # edit/add a contract: picked up next run
      - ../src:/opt/lakehouse/src:ro               # dev loop: code changes need no rebuild
      - airflow-logs:/opt/airflow/home/logs
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
      spark-worker:
        condition: service_started

  dashboard:
    <<: *app-image
    working_dir: /app   # Streamlit reads ./.streamlit/config.toml from here
    command: ["streamlit", "run", "/app/src/covesa_lakehouse/dashboard/app.py",
              "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true",
              "--browser.gatherUsageStats=false"]
    environment:
      <<: *s3-env
      LAKEHOUSE_CATALOG_URI: http://iceberg-rest:8181
      LAKEHOUSE_S3_ENDPOINT: http://rustfs:9000
      CONTRACTS_DIR: /app/contracts
      DTC_CATALOG: /app/sources/dtc/dtc_catalog.yaml
      PYTHONPATH: /app/src   # mounted source wins over the installed copy (live reload)
    volumes:
      - ../src:/app/src:ro
      - ../contracts:/app/contracts:ro
      - ../sources/dtc:/app/sources/dtc:ro
      - ../.streamlit:/app/.streamlit:ro
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      iceberg-rest:
        condition: service_healthy

  fleet-simulator:
    <<: *app-image
    profiles: ["simulate"]
    command: ["python", "-m", "covesa_lakehouse.data_generator.generate_telemetry",
              "--vehicles", "${FLEET_VEHICLES:-44}", "--speedup", "${FLEET_SPEEDUP:-1}"]
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      mosquitto:
        condition: service_healthy

volumes:
  rustfs-data:
  postgres-data:
  mosquitto-data:
  dev-venv:
  uv-cache:
  dev-history:
  airflow-logs:
