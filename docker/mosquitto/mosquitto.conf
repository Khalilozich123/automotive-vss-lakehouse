# Local development broker: emulates the TCU -> cloud MQTT endpoint.
# Anonymous access is fine on a 127.0.0.1-only port; do not reuse this config elsewhere.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# The Bronze bridge acknowledges QoS 1 messages only after they are durably written to the
# landing zone (batches of thousands), so the broker must allow many unacknowledged messages
# in flight, and must queue enough for the bridge's persistent session while it is down.
max_inflight_messages 0
max_queued_messages 500000
