[project]
name = "covesa-lakehouse"
version = "0.1.0"
description = "COVESA VSS-compliant telemetry lakehouse (Bronze / Silver / Gold) on PySpark + Apache Iceberg"
readme = "README.md"
authors = [{ name = "Khalil Hamimid" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    # Must match SPARK_VERSION in docker/Dockerfile.spark (driver and executors in lockstep).
    "pyspark==3.5.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "chispa>=0.10",
    "ruff>=0.6",
    "black>=24",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covesa_lakehouse"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["covesa_lakehouse"]
strict = true

[[tool.mypy.overrides]]
module = ["pyspark.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the running docker compose stack (Spark cluster, Iceberg catalog, object storage)",
]
