# Diagnostic Trouble Codes emitted by the fleet simulator.
# Codes and titles follow the generic (SAE J2012 / ISO 15031-6) code ranges; titles are short
# paraphrases. Each code is raised only after its precursor scenario, so the predictive-DTC mart
# (Phase 4) has real antecedent telemetry to discover in the preceding 10-minute window.

P0A7E:
  title: Hybrid/EV battery pack over temperature
  system: traction_battery
  powertrains: [BEV, PHEV, HEV]
  scenario: battery_overtemp
  precursor: Vehicle.Powertrain.TractionBattery.Temperature.Max ramps ~1.5 C/min above normal

P0A80:
  title: Replace hybrid/EV battery pack (cell/block voltage deviation)
  system: traction_battery
  powertrains: [BEV, PHEV, HEV]
  scenario: cell_imbalance
  precursor: spread between CellVoltage.Max and CellVoltage.Min widens over ~10 min

P0217:
  title: Engine coolant over temperature
  system: engine
  powertrains: [ICE, HEV, PHEV]
  scenario: coolant_overtemp
  precursor: EngineCoolant.Temperature climbs past the thermostat band toward 120 C

P0562:
  title: System voltage low
  system: electrical
  powertrains: [ICE, HEV, PHEV]
  scenario: low_system_voltage
  precursor: Vehicle.LowVoltageBattery.CurrentVoltage sags from ~14 V toward 11 V

P0300:
  title: Random/multiple cylinder misfire detected
  system: engine
  powertrains: [ICE, HEV, PHEV]
  scenario: misfire
  precursor: CombustionEngine.Speed shows growing short-term jitter

U0100:
  title: Lost communication with ECM/PCM
  system: network
  powertrains: [BEV, PHEV, HEV, ICE]
  scenario: ecm_comm_loss
  precursor: powertrain signals increasingly missing from telemetry messages
